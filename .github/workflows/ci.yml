name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Claude Code and cmod, which check the mod
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @cmodjs/cli

      - name: Start the user's systemd, which runs each claude --bg and claude attach in a scope on Linux
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          timeout 30 bash -c 'until [ -S "/run/user/$(id -u)/bus" ]; do sleep 1; done'

      - name: Install the packages of the mod, the program and the relay
        run: |
          bun install --frozen-lockfile
          bun install --cwd cli --frozen-lockfile
          bun install --cwd relay --frozen-lockfile

      - name: Check the types of the anyhost program and the relay
        run: |
          bun run --cwd cli check
          bun run --cwd relay check

      # cmod check runs tests/mod.test.ts and relay/relay.test.ts with bun test, and no file of cli/tests, so this step
      # runs only the program's
      - name: Test the anyhost program
        run: bun test ./cli/tests

      - name: Check the mod, and test the mod and the relay
        run: cmod check .

  # A release goes out only once the Mac and Linux both passed.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Claude Code and cmod, which publish the mod
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @cmodjs/cli

      # The program's build installs its own packages, and the relay's bundle needs none.
      - name: Install the packages of the mod
        run: bun install --frozen-lockfile

      - name: Release the version when it is new
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is released already"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cmod publish .
