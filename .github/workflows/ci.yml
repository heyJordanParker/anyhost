name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Claude Code and cmod, which check and publish the mod
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @cmodjs/cli

      - name: Install the packages of the mod and the program
        run: |
          bun install --frozen-lockfile
          bun install --cwd cli --frozen-lockfile

      - name: Check the types of the anyhost program
        run: bun run --cwd cli check

      - name: Test the mod and the anyhost program
        run: bun test

      - name: Check and test the mod
        run: cmod check .

      - name: Release the version when it is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is released already"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cmod publish .
